<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 30 960 320" role="img" aria-label="Barış Olçay. Computer engineer in İzmir. I built HealthVerse on my own, from the first idea to both app stores.">
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;letter-spacing:.5px}
</style>
<text x="36" y="140" class="sans" font-size="68" font-weight="700" letter-spacing="-2" fill="#1F2328">Barış Olçay</text>
<text x="40" y="192" class="sans" font-size="22" fill="#59636E">Computer engineer in İzmir.</text>
<text x="40" y="226" class="sans" font-size="22" fill="#59636E">I built <tspan fill="#1F2328">HealthVerse</tspan> on my own, from the first idea to both app stores.</text>
<line x1="40" y1="290" x2="920" y2="290" stroke="#D0D7DE" stroke-width="1.5"/>
<line x1="40" y1="290" x2="40" y2="290" stroke="#D4532A" stroke-width="1.5">
  <animate attributeName="x2" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.8;0.95;1" values="40;920;920;40" calcMode="linear"/>
  <animate attributeName="opacity" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.95;1" values="1;1;0" calcMode="discrete"/>
</line>
<circle cx="40.0" cy="290" r="5" fill="#D0D7DE"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.95;1" values="#D4532A;#D4532A;#D0D7DE" calcMode="discrete"/></circle>
<text x="40.0" y="322" text-anchor="start" class="mono" fill="#59636E">idea</text>
<circle cx="260.0" cy="290" r="5" fill="#D0D7DE"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.19990000000000002;0.2;0.95;1" values="#D0D7DE;#D0D7DE;#D4532A;#D4532A;#D0D7DE" calcMode="discrete"/></circle>
<text x="260.0" y="322" text-anchor="middle" class="mono" fill="#59636E">spec</text>
<circle cx="480.0" cy="290" r="5" fill="#D0D7DE"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.39990000000000003;0.4;0.95;1" values="#D0D7DE;#D0D7DE;#D4532A;#D4532A;#D0D7DE" calcMode="discrete"/></circle>
<text x="480.0" y="322" text-anchor="middle" class="mono" fill="#59636E">build</text>
<circle cx="700.0" cy="290" r="5" fill="#D0D7DE"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.5999;0.6;0.95;1" values="#D0D7DE;#D0D7DE;#D4532A;#D4532A;#D0D7DE" calcMode="discrete"/></circle>
<text x="700.0" y="322" text-anchor="middle" class="mono" fill="#59636E">review</text>
<circle cx="920.0" cy="290" r="7" fill="#D0D7DE"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.7999;0.8;0.95;1" values="#D0D7DE;#D0D7DE;#D4532A;#D4532A;#D0D7DE" calcMode="discrete"/></circle>
<text x="920.0" y="322" text-anchor="end" class="mono" fill="#59636E">ship</text>
</svg>