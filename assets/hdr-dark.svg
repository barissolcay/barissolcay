<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Barış Olçay — I take products from idea to the App Store">
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;letter-spacing:.5px}
</style>
<text x="40" y="42" class="mono" fill="#8B949E">barissolcay</text>
<text x="920" y="42" text-anchor="end" class="mono" fill="#8B949E">İzmir · 38.42°N 27.14°E</text>
<text x="36" y="128" class="sans" font-size="68" font-weight="700" letter-spacing="-2" fill="#E6EDF3">Barış Olçay</text>
<text x="40" y="170" class="sans" font-size="22" fill="#8B949E">An engineer with a <tspan fill="#E6EDF3">product brain</tspan>.</text>
<text x="40" y="200" class="sans" font-size="22" fill="#8B949E">I decide what to build, then build it end to end.</text>
<line x1="40" y1="250" x2="920" y2="250" stroke="#30363D" stroke-width="1.5"/>
<line x1="40" y1="250" x2="40" y2="250" stroke="#F0794F" stroke-width="1.5">
  <animate attributeName="x2" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.8;0.95;1" values="40;920;920;40" calcMode="linear"/>
  <animate attributeName="opacity" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.95;1" values="1;1;0" calcMode="discrete"/>
</line>
<circle cx="40.0" cy="250" r="5" fill="#30363D"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.95;1" values="#F0794F;#F0794F;#30363D" calcMode="discrete"/></circle>
<text x="40.0" y="282" text-anchor="start" class="mono" fill="#8B949E">idea</text>
<circle cx="260.0" cy="250" r="5" fill="#30363D"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.19990000000000002;0.2;0.95;1" values="#30363D;#30363D;#F0794F;#F0794F;#30363D" calcMode="discrete"/></circle>
<text x="260.0" y="282" text-anchor="middle" class="mono" fill="#8B949E">spec</text>
<circle cx="480.0" cy="250" r="5" fill="#30363D"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.39990000000000003;0.4;0.95;1" values="#30363D;#30363D;#F0794F;#F0794F;#30363D" calcMode="discrete"/></circle>
<text x="480.0" y="282" text-anchor="middle" class="mono" fill="#8B949E">build</text>
<circle cx="700.0" cy="250" r="5" fill="#30363D"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.5999;0.6;0.95;1" values="#30363D;#30363D;#F0794F;#F0794F;#30363D" calcMode="discrete"/></circle>
<text x="700.0" y="282" text-anchor="middle" class="mono" fill="#8B949E">review</text>
<circle cx="920.0" cy="250" r="7" fill="#30363D"><animate attributeName="fill" dur="7.0s" repeatCount="indefinite" keyTimes="0;0.7999;0.8;0.95;1" values="#30363D;#30363D;#F0794F;#F0794F;#30363D" calcMode="discrete"/></circle>
<text x="920.0" y="282" text-anchor="end" class="mono" fill="#8B949E">ship</text>
</svg>