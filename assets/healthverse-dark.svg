<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="HealthVerse — a gamified health and fitness app, live on iOS and Android">
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;letter-spacing:1.5px}
.num{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px}
</style>
<rect x="1" y="1" width="958" height="258" rx="14" fill="#161B22" stroke="#30363D"/>
<circle cx="44" cy="46" r="4" fill="#F0794F"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="56" y="50" class="mono" fill="#F0794F">NOW SHIPPING</text>
<text x="38" y="104" class="sans" font-size="40" font-weight="700" letter-spacing="-1" fill="#E6EDF3">HealthVerse</text>
<text x="40" y="140" class="sans" font-size="17" fill="#8B949E">Your daily steps become a weekly race with friends:</text>
<text x="40" y="164" class="sans" font-size="17" fill="#8B949E">leagues, streaks, duels and team challenges.</text>
<text x="40" y="214" class="mono" fill="#8B949E">SOLO BUILD · FLUTTER · ASP.NET CORE · POSTGRESQL · REACT</text>
<text x="590" y="50" class="mono" fill="#8B949E">THIS WEEK'S LEAGUE · STEPS</text>
<g>
  <rect x="590" y="64" width="330" height="38" rx="8" fill="#0D1117" stroke="#30363D"/>
  <text x="636" y="88" class="sans" font-size="15" font-weight="400" fill="#E6EDF3">Elif</text>
  <text x="904" y="88" text-anchor="end" class="num" fill="#8B949E">61,204</text>
</g>
<g><animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" keyTimes="0;0.25;0.4;0.85;1" values="0 0;0 0;0 46;0 46;0 0" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
  <rect x="590" y="110" width="330" height="38" rx="8" fill="#0D1117" stroke="#30363D"/>
  <text x="636" y="134" class="sans" font-size="15" font-weight="400" fill="#E6EDF3">Mert</text>
  <text x="904" y="134" text-anchor="end" class="num" fill="#8B949E">58,117</text>
</g>
<g><animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" keyTimes="0;0.25;0.4;0.85;1" values="0 0;0 0;0 -46;0 -46;0 0" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
  <rect x="590" y="156" width="330" height="38" rx="8" fill="#0D1117" stroke="#F0794F"/>
  <text x="636" y="180" class="sans" font-size="15" font-weight="600" fill="#E6EDF3">You</text>
  <text x="904" y="180" text-anchor="end" class="num" fill="#8B949E">57,640<animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.25;0.85;1" values="1;0;1;1" calcMode="discrete"/></text><text x="904" y="180" text-anchor="end" class="num" fill="#8B949E" opacity="0">58,902<animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.25;0.85;1" values="0;1;0;0" calcMode="discrete"/></text>
</g>
<g>
  <rect x="590" y="202" width="330" height="38" rx="8" fill="#0D1117" stroke="#30363D"/>
  <text x="636" y="226" class="sans" font-size="15" font-weight="400" fill="#E6EDF3">Deniz</text>
  <text x="904" y="226" text-anchor="end" class="num" fill="#8B949E">54,880</text>
</g>
<text x="928" y="134" class="num" fill="#F0794F" opacity="0">↑<animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.45;0.85;0.9;1" values="0;0;1;1;0;0"/></text>
<text x="608" y="88" class="num" fill="#8B949E">1</text>
<text x="608" y="134" class="num" fill="#8B949E">2</text>
<text x="608" y="180" class="num" fill="#8B949E">3</text>
<text x="608" y="226" class="num" fill="#8B949E">4</text>
</svg>