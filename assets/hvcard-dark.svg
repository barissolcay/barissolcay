<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-label="HealthVerse — a movement game for iOS and Android">
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;letter-spacing:1.5px}
.num{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px}
</style>
<rect x="1" y="1" width="958" height="288" rx="14" fill="#161B22" stroke="#30363D"/>
<circle cx="44" cy="52" r="4" fill="#F0794F"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="56" y="56" class="mono" fill="#F0794F">NOW SHIPPING</text>
<text x="38" y="112" class="sans" font-size="40" font-weight="700" letter-spacing="-1" fill="#E6EDF3">HealthVerse</text>
<text x="40" y="152" class="sans" font-size="17" fill="#8B949E">A movement game. Steps and workouts from 20+ sports</text>
<text x="40" y="178" class="sans" font-size="17" fill="#8B949E">earn points in solo, joint and community tasks, and</text>
<text x="40" y="204" class="sans" font-size="17" fill="#8B949E">those points climb a weekly league. Duels too.</text>
<text x="40" y="252" class="mono" fill="#8B949E">SOLO BUILD · FLUTTER · ASP.NET CORE · POSTGRESQL · REACT</text>
<text x="590" y="56" class="mono" fill="#8B949E">THIS WEEK · POINTS</text>
<g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.1;0.14;0.92;0.9600000000000001;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;0.1;0.14;1" values="0 6;0 6;0 0;0 0"/>
  <rect x="590" y="76" width="330" height="34" rx="8" fill="#0D1117" stroke="#30363D"/>
  <text x="604" y="98" class="sans" font-size="14" fill="#E6EDF3">Solo task · 5 km run</text>
  <text x="906" y="98" text-anchor="end" class="num" fill="#F0794F">+40</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.29;0.92;0.9600000000000001;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.29;1" values="0 6;0 6;0 0;0 0"/>
  <rect x="590" y="122" width="330" height="34" rx="8" fill="#0D1117" stroke="#30363D"/>
  <text x="604" y="144" class="sans" font-size="14" fill="#E6EDF3">Joint task with Elif</text>
  <text x="906" y="144" text-anchor="end" class="num" fill="#F0794F">+60</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.4;0.44;0.92;0.9600000000000001;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;0.4;0.44;1" values="0 6;0 6;0 0;0 0"/>
  <rect x="590" y="168" width="330" height="34" rx="8" fill="#0D1117" stroke="#30363D"/>
  <text x="604" y="190" class="sans" font-size="14" fill="#E6EDF3">Community challenge</text>
  <text x="906" y="190" text-anchor="end" class="num" fill="#F0794F">+25</text>
</g>
<rect x="590" y="218" width="330" height="38" rx="8" fill="#0D1117" stroke="#F0794F"/>
<text x="604" y="242" class="sans" font-size="14" font-weight="600" fill="#E6EDF3">Weekly league</text>
<g opacity="1"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.1;0.9600000000000001;1" values="1;0;1;1" calcMode="discrete"/><text x="860" y="242" text-anchor="end" class="num" fill="#8B949E">1,055 pts</text><text x="906" y="242" text-anchor="end" class="num" font-weight="700" fill="#E6EDF3">#6</text></g>
<g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.1;0.25;1" values="0;1;0;0" calcMode="discrete"/><text x="860" y="242" text-anchor="end" class="num" fill="#8B949E">1,095 pts</text><text x="906" y="242" text-anchor="end" class="num" font-weight="700" fill="#E6EDF3">#5</text></g>
<g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.4;1" values="0;1;0;0" calcMode="discrete"/><text x="860" y="242" text-anchor="end" class="num" fill="#8B949E">1,155 pts</text><text x="906" y="242" text-anchor="end" class="num" font-weight="700" fill="#E6EDF3">#4</text></g>
<g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.4;0.9600000000000001;1" values="0;1;0;0" calcMode="discrete"/><text x="860" y="242" text-anchor="end" class="num" fill="#8B949E">1,180 pts</text><text x="906" y="242" text-anchor="end" class="num" font-weight="700" fill="#F0794F">#3</text></g>
</svg>